spring.application.name=cist2ics

# CIST timetable API. The fallback host is a mirror that CIST runs for outages.
cist.base-url=https://cist.nure.ua/ias/app/tt
cist.fallback-base-url=https://cist2.nure.ua/ias/app/tt
cist.connect-timeout=5s
cist.read-timeout=15s

# How long to keep the faculty/department/teacher directory.
cist.directory-ttl=24h
# How long a calendar is fresh, and how long to keep it as a fallback for CIST outages.
cist.calendar-fresh-ttl=1h
cist.calendar-stale-ttl=7d

management.endpoints.web.exposure.include=health
